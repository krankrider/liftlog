<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift log">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift log</title>
<style>
/* Liquid Glass per Apple's HIG: glass only on the floating controls (header buttons, primary actions);
   content sits on plain cards. Black and white only, so the white status bar text always reads. */
:root{color-scheme:dark;--fg:#fff;--mut:rgba(255,255,255,.6);--dim:rgba(255,255,255,.3);--fill:rgba(255,255,255,.2);--fill2:rgba(255,255,255,.1);--card:rgba(24,24,24,.75);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#000}
body{margin:0;font:17px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg);padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 45% at 10% 0%,rgba(255,255,255,.13),transparent 70%),radial-gradient(55% 40% at 100% 30%,rgba(255,255,255,.07),transparent 70%),radial-gradient(70% 45% at 30% 100%,rgba(255,255,255,.05),transparent 70%)}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;transition:transform .2s,background-color .2s}
.glass{border-radius:999px;border:.5px solid rgba(255,255,255,.22);font-weight:600;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.35)}
.tint,.rir .on{border:0;border-radius:999px;font-weight:600;color:#000;background:linear-gradient(#fff,#d6d6d6);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 5px rgba(0,0,0,.15),0 6px 20px rgba(255,255,255,.12)}
.glass:active,.tint:active,.grid button:active{transform:scale(.95)}
header{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 16px 16px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.35) 65%,transparent)}
header::before{content:"";position:absolute;inset:0;z-index:-1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
header button{height:44px;min-width:44px;padding:0 18px;font-size:17px}
#homeBtn{grid-column:1;justify-self:start;padding:0;display:grid;place-items:center}
#hdr{grid-column:2;font-weight:600}
#export{grid-column:3;justify-self:end}
main{padding:0 16px;max-width:600px;margin:0 auto}
h1{font-size:34px;font-weight:700;margin:0 4px 16px}
h2{font-size:20px;font-weight:700;margin:28px 4px 10px}
.big{display:block;width:100%;height:58px;margin:0 0 12px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button,.card,.group,.del{background:var(--card);border:.5px solid rgba(255,255,255,.08);box-shadow:inset 0 .5px 0 rgba(255,255,255,.1)}
.grid button{height:50px;border-radius:25px;font-weight:600}
.card{border-radius:26px;padding:14px 16px;margin:12px 0}
.group{border-radius:26px;overflow:hidden}
/* Swipe-to-delete with no script: each history row scrolls sideways and snaps to show the Delete button. */
.row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row+.row{background:linear-gradient(var(--line),var(--line)) 16px 0/100% .5px no-repeat}
.open{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 16px;border:0;background:none;text-align:left}
.open:active{background:var(--fill2)}
.open .t{flex:1;display:flex;flex-direction:column}
.open b{font-weight:600}
.open small{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.chev{color:var(--dim);font-size:26px;line-height:1}
.rm{flex:none;scroll-snap-align:end;width:96px;border:0;background:#fff;color:#000;font-weight:600}
.ex h3{margin:0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rx{color:var(--mut);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--fill);color:#fff;vertical-align:2px}
.last{color:var(--mut);font-size:14px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.badge{display:table;margin-top:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.up{color:#000;background:#fff}.down{color:#fff;box-shadow:inset 0 0 0 1px var(--mut)}
.hist{font-size:14px;color:var(--mut);margin:0 0 10px;padding:10px 12px;border-radius:16px;background:var(--fill2);white-space:pre-line;font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-areas:"n w r" "l rir rir";gap:8px 10px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}
.set:last-child{padding-bottom:2px}
.set.done .num,.set.done .n{opacity:.45}
.n{grid-area:n;color:var(--mut);font-size:15px;font-weight:600;text-align:center}
.lbl{grid-area:l;color:var(--mut);font-size:11px;font-weight:600;text-align:center}
.w{grid-area:w}.r{grid-area:r}
.num{display:flex;align-items:center;height:44px;border-radius:22px;background:var(--fill2);overflow:hidden}
.num button{width:44px;height:44px;border:0;background:none;color:var(--fg);font-size:24px;flex:none}
.num button:active{background:var(--fill)}
.num input{width:100%;min-width:0;height:44px;text-align:center;border:0;background:none;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;outline:none;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{display:none}
.rir{grid-area:rir;display:flex;gap:2px;padding:3px;border-radius:22px;background:var(--fill2)}
.rir button{flex:1;height:38px;border:0;border-radius:19px;background:none;font-size:15px;font-weight:600}
.form{padding-block:4px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
.fr+.fr{border-top:.5px solid var(--line)}
.fr input{border:0;border-radius:10px;background:var(--fill2);padding:6px 10px;font-size:17px;outline:none}
.bw{width:90px;text-align:right;-moz-appearance:textfield}
textarea{display:block;width:100%;min-height:72px;border:0;background:none;resize:vertical;font-size:17px;outline:none;padding:0}
::placeholder{color:var(--dim);font-weight:400}
.foot{margin-top:24px}
.del{display:block;width:100%;height:50px;margin-top:14px;border-radius:25px;font-weight:600}
.note{color:var(--mut);font-size:13px;text-align:center;margin:28px 8px}
.link{background:none;border:0;color:var(--fg);padding:0;font-size:inherit;text-decoration:underline}
#t{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);background:var(--card);padding:12px 14px;border-radius:18px;white-space:pre-wrap;margin:0 0 12px}
.cal{padding:10px 10px 12px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh b{font-weight:600}
.mh button{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.days i{font-style:normal;font-size:12px;font-weight:600;color:var(--dim);padding-bottom:4px}
.day{display:flex;flex-direction:column;align-items:center;height:52px;padding:0;border:0;background:none;font-variant-numeric:tabular-nums}
.day b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:400;color:var(--mut)}
.day small{font-size:11px;font-weight:600;color:var(--mut);margin-top:2px}
.day.on b{background:#fff;color:#000;font-weight:600}
.day.now b{box-shadow:inset 0 0 0 1.5px #fff;color:var(--fg)}
.day.on.now b{box-shadow:0 0 0 2px #000,0 0 0 3.5px #fff;color:#000}
/* Rest timer: a plain card pinned to the bottom (it holds content, so no glass). Turns white when it is time to lift. */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;max-width:576px;margin:0 auto;padding:14px 16px 16px;border-radius:26px;background:#141414;border:.5px solid rgba(255,255,255,.2);box-shadow:0 10px 40px #000}
body.resting{padding-bottom:calc(env(safe-area-inset-bottom) + 250px)}
.rt{display:flex;align-items:center;justify-content:space-between}
#restClock{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#skip{height:44px;padding:0 18px}
.bar{height:3px;margin:12px 0 10px;border-radius:2px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;transition:width .25s linear}
#restNx{margin:0 0 4px;font-weight:600}
#restNx small{color:var(--mut);font-size:14px;font-weight:400;white-space:nowrap}
#restTips{margin:0;padding:0;list-style:none;color:var(--mut);font-size:15px}
#rest.go{background:#fff;color:#000}
#rest.go .bar{visibility:hidden}
#rest.go #restNx small,#rest.go #restTips{color:rgba(0,0,0,.6)}
#rest.go #skip{background:#000;color:#fff;box-shadow:none}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){:root{--card:#181818;--mut:rgba(255,255,255,.8)}.glass{background:#2a2a2a;-webkit-backdrop-filter:none;backdrop-filter:none}header{background:#000}header::before,body::before{display:none}}
</style>
</head>
<body>
<header><button id="homeBtn" class="glass" aria-label="Back" hidden><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="hdr"></span><button id="export" class="glass">Export</button></header>
<main id="app"></main>
<section id="rest" hidden><div class="rt"><b id="restClock"></b><button id="skip" class="glass">Skip</button></div><div class="bar"><i id="restBar"></i></div><p id="restNx"></p><ul id="restTips"></ul></section>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
// Program v4 (sets, rep range, target RIR, rest in seconds, superset tag). Edit here when the program changes.
// Rest per the v3 PDF: first heavy compound 3 min, other compounds 2 min, isolation 90 s.
// A superset pair rests only after its second exercise; A1 goes straight into A2.
function X(name,sets,lo,hi,rir,rest,ss){return{name,sets,lo,hi,rir,rest,ss}}
const PROGRAM={
"Upper A":[
 X("Barbell Bench Press",3,5,8,"1-2",180),
 X("Incline DB Press",4,8,12,"1-2",120,"A1"),
 X("Weighted Pull-up / Lat Pulldown",4,8,10,"1-2",120,"A2"),
 X("Lateral Raise (DB)",4,15,20,"0-1",90),
 X("Face Pull",3,15,20,"1-2",90),
 X("Incline DB Curl",3,10,15,"0-1",90,"B1"),
 X("Overhead Cable Triceps Ext.",3,10,15,"0-1",90,"B2")],
"Lower A":[
 X("Back Squat",3,5,8,"1-2",180),
 X("Romanian Deadlift",3,8,10,"1-2",120),
 X("Leg Press / Walking Lunge",3,10,12,"1-2",120),
 X("Calf Raise",3,12,15,"0-1",90,"A1"),
 X("Neck Curl (flexion)",3,15,20,"2",90,"A2"),
 X("Lateral Neck Flexion (per side)",2,15,20,"2",45)],
"Upper B":[
 X("Overhead Press",3,6,10,"1-2",180),
 X("Barbell Shrug",4,10,15,"0-1",120),
 X("Weighted Dip / Incline Press",3,8,12,"1-2",120,"A1"),
 X("Barbell Row",3,8,12,"1-2",120,"A2"),
 X("Lat Pulldown",3,12,15,"1-2",120),
 X("Cable Lateral Raise",4,15,20,"0-1",90),
 X("EZ-Bar Curl",3,8,12,"1-2",90,"B1"),
 X("Triceps Pushdown",3,10,15,"0-1",90,"B2")],
"Lower B":[
 X("Trap Bar Deadlift",3,5,8,"1-2",180),
 X("Trap Bar Shrug",3,10,15,"0-1",120),
 X("Bulgarian Split Squat (per leg)",3,8,12,"1-2",120),
 X("Leg Curl",3,10,12,"1-2",90),
 X("Calf Raise",3,12,15,"0-1",90,"A1"),
 X("Neck Extension",3,15,20,"2",90,"A2"),
 X("Lateral Neck Flexion (per side)",2,15,20,"2",45)]};

// Cues shown during rest, one idea per line. From the v3 PDF's exercise guide; Lat Pulldown and the
// trap-bar lifts are v4 additions with no PDF entry.
const TIPS={
"Barbell Bench Press":["Feet planted, slight arch.","Shoulder blades pinched.","Lower over the chest in 2–3 s, press up."],
"Incline DB Press":["Bench at 30–45°.","Press the dumbbells from shoulder level.","Aim for the upper chest."],
"Weighted Pull-up / Lat Pulldown":["Hang from the bar, pull your chin over it.","Add a belt with weight when bodyweight gets easy.","Or use the pulldown machine."],
"Lateral Raise (DB)":["Raise your arms out to shoulder height.","Slight bend in the elbows.","Light weight, control the way down."],
"Face Pull":["Rope at face height.","Pull towards your face, elbows high.","Squeeze the rear delts."],
"Incline DB Curl":["Sit back on a 45–60° bench, arms hanging behind you.","Curl up without moving the elbows.","The stretch at the bottom is the point."],
"Overhead Cable Triceps Ext.":["Rope on a low cable, face away.","Elbows by your ears.","Lower behind the head, extend up."],
"Back Squat":["Bar on the upper back.","Down until thighs are at least parallel.","Knees track over toes, drive up."],
"Romanian Deadlift":["Bar at the hips, flat back, soft knees.","Push the hips back, lower to mid-shin.","The hamstring stretch is the point."],
"Leg Press / Walking Lunge":["Leg press: feet shoulder-width, push the platform away.","Lunge: step forward holding dumbbells."],
"Calf Raise":["Stand on an edge, rise onto your toes.","Pause at the top.","Lower below the edge for a full stretch."],
"Neck Curl (flexion)":["Lie on your back, head off the bench.","Plate on the forehead on a towel, both hands on it.","Tuck chin to chest, lower slowly. Never jerk."],
"Lateral Neck Flexion (per side)":["Lie on your side, head off the bench.","Plate on the side of your head.","Raise ear to shoulder, lower slowly.","Both sides."],
"Overhead Press":["Bar at the collarbone.","Press straight up until the arms lock.","Squeeze the glutes, lower back neutral."],
"Barbell Shrug":["Heavy bar at the hips.","Shrug straight up towards your ears.","Pause at the top, lower slowly. No rolling."],
"Weighted Dip / Incline Press":["Dip: lower until upper arms are parallel to the floor.","Lean forward a little for chest.","Incline: bench at 30–45°, press from the shoulders."],
"Barbell Row":["Hinge to about 45°.","Pull to the lower ribs, elbows back.","Squeeze the shoulder blades. Don't jerk with the back."],
"Lat Pulldown":["Grip a little wider than the shoulders.","Pull to the upper chest, elbows down.","Let it up slowly to a full stretch."],
"Cable Lateral Raise":["One arm on a low cable.","Raise the arm out to the side.","Tension the whole way up and down."],
"EZ-Bar Curl":["Stand, elbows pinned to your sides.","Curl up, 2–3 s down.","No swinging the torso."],
"Triceps Pushdown":["High cable, bar or rope.","Elbows fixed at your sides.","Push down until the arms lock, control back up."],
"Trap Bar Deadlift":["Stand in the middle of the bar.","Flat back, drive through the floor.","Stand up tall."],
"Trap Bar Shrug":["Same bar, strip a plate if needed.","Shrug straight up towards your ears.","Pause at the top, lower slowly."],
"Bulgarian Split Squat (per leg)":["Rear foot on a bench, dumbbells in hands.","Lower until the front thigh is parallel.","Push back up."],
"Leg Curl":["Curl the pad towards your glutes with your heels.","Lower slowly."],
"Neck Extension":["Lie face down, head off the bench.","Plate on the back of your head.","Lift your head up, lower slowly."]};

const KEY='liftlog';
let db=JSON.parse(localStorage.getItem(KEY)||'{"sessions":[]}'), cur=null, noSave=false;
const save=()=>{if(!noSave)localStorage.setItem(KEY,JSON.stringify(db))};
const app=document.getElementById('app'), hdr=document.getElementById('hdr'), importFile=document.getElementById('importFile');
const back=document.getElementById('homeBtn'), exp=document.getElementById('export');
const rest=document.getElementById('rest'), restClock=document.getElementById('restClock'), restBar=document.getElementById('restBar'), restNx=document.getElementById('restNx'), restTips=document.getElementById('restTips');
const today=()=>new Date().toLocaleDateString('sv');
const byDate=(a,b)=>(b.date+b.id).localeCompare(a.date+a.id);
const done=s=>s.rir!=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const names=()=>Object.keys(PROGRAM);
const drop=id=>{db.sessions=db.sessions.filter(s=>s.id!==id);save()};
const addDays=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const niceDate=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

// Deload week: db.deload is its first day. For 7 days new sessions get about 60% of the sets at the same weights,
// and those sessions are left out of badges and prefill.
const deloadOn=()=>db.deload!=null&&daysBetween(db.deload,today())>=0&&daysBetween(db.deload,today())<7;
const setsFor=(s,e)=>s.deload?Math.max(1,Math.round(e.sets*.6)):e.sets;
function deloadInfo(){
  if(deloadOn())return{on:true,until:addDays(db.deload,6)};
  const from=db.deload?addDays(db.deload,7):db.sessions.map(s=>s.date).sort()[0];
  if(!from)return null;
  const week=Math.max(1,Math.floor(daysBetween(from,today())/7)+1);
  return{week,due:week>=6,after:db.deload!=null};
}
// Average bodyweight of the last 7 days against the 7 days before.
function bwLine(){
  const wk=k=>db.sessions.filter(s=>s.bw&&daysBetween(s.date,today())>=k*7&&daysBetween(s.date,today())<k*7+7).map(s=>s.bw);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,now=wk(0),before=wk(1);
  if(!now.length)return'';
  const line=`Bodyweight ${avg(now).toFixed(1)} kg`;
  if(!before.length)return line;
  const d=Math.round((avg(now)-avg(before))*10)/10;
  return line+(d?`, ${d>0?'+':'−'}${Math.abs(d).toFixed(1)} on the week before`:', same as the week before');
}
// Ramp-up from the program for the first lift: bar ×10, 50% ×5, 70% ×3, 85% ×1, rounded to 2.5 kg.
function warmup(w){
  if(!(w>20))return'';
  const steps=[[.5,5],[.7,3],[.85,1]].map(([p,r])=>[Math.round(w*p/2.5)*2.5,r]).filter(([k],i,a)=>k>20&&k<w&&a.findIndex(x=>x[0]===k)===i);
  return'Warm-up: '+['bar ×10',...steps.map(([k,r])=>`${k} ×${r}`)].join(' · ');
}
// Minutes since the first rated set, today only. Stops at the last rated set once nothing has been rated for 30 min.
function mins(s,now){
  if(!s.start||s.date!==today())return null;
  return Math.floor(((now-s.last<18e5?now:s.last)-s.start)/6e4);
}

function lastOf(name,excludeId){return db.sessions.filter(s=>s.id!==excludeId&&!s.deload&&s.ex[name]?.some(done)).sort(byDate)[0]||null}
function nextName(){const last=db.sessions.slice().sort(byDate)[0],n=names();return last?n[(n.indexOf(last.name)+1)%n.length]:n[0]}

// Double progression from the program: all sets at the top of the range -> add weight; any set under the range -> too heavy.
// Every set rated RIR 3 or more -> too light, add weight too ('easy').
function suggest(ex,sets){
  const d=(sets||[]).filter(s=>done(s)&&s.r!=null);
  if(!d.length)return null;
  if(d.some(s=>s.r<ex.lo))return'down';
  if(d.length>=ex.sets&&d.every(s=>s.r>=ex.hi))return'up';
  if(d.length>=ex.sets&&d.every(s=>s.rir>=3))return'easy';
  return null;
}
// What comes after a set of `name` in session s, and how long to rest before it.
// A1 goes straight into A2; A2 goes back to A1; a finished exercise moves to the next one with an open set.
function afterSet(s,name){
  const list=PROGRAM[s.name],k=list.findIndex(e=>e.name===name),e=list[k];
  const at=x=>{const i=(s.ex[x.name]||[]).findIndex(st=>!done(st));return i<0?null:{name:x.name,i}};
  const mate=e.ss&&list.find(x=>x!==e&&x.ss?.[0]===e.ss[0]);
  if(mate&&e.ss[1]==='1'&&at(mate))return{rest:0,next:at(mate)};
  const order=(mate?[e,mate].sort((a,b)=>a.ss.localeCompare(b.ss)):[e]).concat(list.slice(k+1),list.slice(0,k));
  for(const x of order){const n=at(x);if(n)return{rest:e.rest,next:n}}
  return{rest:e.rest,next:null};
}
function newSession(name){
  const s={id:Date.now().toString(36),date:today(),name,bw:null,note:'',ex:{}};
  if(deloadOn())s.deload=true;
  for(const e of PROGRAM[name]){
    const prev=lastOf(e.name),ps=prev?prev.ex[e.name].filter(done):[],sug=suggest(e,ps);
    s.ex[e.name]=Array.from({length:setsFor(s,e)},(_,i)=>{const p=ps[i]||ps[ps.length-1];return{w:p?p.w:null,r:p?(sug==='up'||sug==='easy'?e.lo:p.r):null,rir:null}});
  }
  db.sessions.push(s);save();return s;
}
function fmt(sets){
  if(!sets.length)return'';
  if(new Set(sets.map(x=>x.w)).size===1)return`${sets[0].w??'–'} kg · ${sets.map(x=>`${x.r??'–'}@${x.rir}`).join(' ')}`;
  return sets.map(x=>`${x.w??'–'}×${x.r??'–'}@${x.rir}`).join(' ');
}

// Month calendar, Monday first. A trained day opens its session; the letters are the session (Upper A = UA).
let calY=new Date().getFullYear(),calM=new Date().getMonth();
function calHTML(y,m){
  const pad=n=>String(n).padStart(2,'0'),lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const cells=Array.from({length:lead},()=>'<span></span>');
  for(let d=1;d<=days;d++){
    const date=`${y}-${pad(m+1)}-${pad(d)}`,s=db.sessions.filter(x=>x.date===date).sort(byDate)[0],cls=date===today()?' now':'';
    cells.push(s?`<button class="day on${cls}" data-open="${s.id}"><b>${d}</b><small>${esc(s.name.split(' ').map(w=>w[0]).join(''))}</small></button>`:`<span class="day${cls}"><b>${d}</b></span>`);
  }
  return`<div class="card cal"><div class="mh"><button data-cal="-1" aria-label="Previous month">‹</button><b>${new Date(y,m,1).toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button data-cal="1" aria-label="Next month">›</button></div>
  <div class="days">${['M','T','W','T','F','S','S'].map(d=>`<i>${d}</i>`).join('')}${cells.join('')}</div></div>`;
}
function home(){
  cur=null;hdr.textContent='';back.hidden=true;exp.hidden=false;stopRest();clearInterval(clock);
  const next=nextName(),all=db.sessions.slice().sort(byDate),bw=bwLine(),dl=deloadInfo();
  const dlText=dl&&(dl.on?`Deload week until ${niceDate(dl.until)}`:dl.due?'Deload week due':`Week ${dl.week} since ${dl.after?'the last deload':'you started'}`);
  app.innerHTML=`<h1>Lift log</h1><button class="big tint" data-start="${next}">Start ${next}</button>
  <div class="grid">${names().filter(n=>n!==next).map(n=>`<button data-start="${n}">${n}</button>`).join('')}</div>
  ${bw||dl?`<div class="card form">${bw?`<div class="fr">${bw}</div>`:''}${dl?`<div class="fr">${dlText}</div>`:''}</div>`:''}
  ${dl&&!dl.on?'<button class="del" data-deload>Start deload week</button>':''}
  <h2>Calendar</h2>${calHTML(calY,calM)}
  <h2>History</h2>${all.length?`<div class="group">${all.map(s=>`<div class="row"><button class="open" data-open="${s.id}"><span class="t"><b>${esc(s.name)}</b><small>${esc(s.date)}</small></span>${s.bw?`<span class="rx">${s.bw} kg</span>`:''}<span class="chev">›</span></button><button class="rm" data-rm="${s.id}">Delete</button></div>`).join('')}</div>`:'<p class="note">Nothing logged yet.</p>'}
  <p class="note">Data lives on this phone only. Export now and then. <button class="link" id="imp">Import a backup</button></p>`;
  scrollTo(0,0);
}
// Header in a session: name, Deload, minutes so far.
let clock=null;
function head(){
  if(!cur)return;
  const m=mins(cur,Date.now());
  hdr.textContent=[cur.name,cur.deload?'Deload':'',m!=null?`${m} min`:''].filter(x=>x).join(' · ');
}
function session(s){
  cur=s;back.hidden=false;exp.hidden=true;stopRest();
  head();clearInterval(clock);clock=setInterval(head,15e3);
  app.innerHTML=`<div class="card form"><label class="fr"><span>Date</span><input type="date" value="${s.date}" data-f="date"></label><label class="fr"><span>Bodyweight</span><input type="number" class="bw" inputmode="decimal" step="0.1" placeholder="kg" value="${s.bw??''}" data-f="bw"></label></div>`
   +PROGRAM[s.name].map(e=>exCard(s,e)).join('')
   +`<div class="card"><textarea data-f="note" placeholder="Notes for next time: pain, sleep, what to change">${esc(s.note||'')}</textarea></div>
   <div class="foot"><button class="big tint" data-finish>Done</button><button class="del" data-del>Delete session</button></div>`;
  scrollTo(0,0);
}
function exCard(s,e){
  const sets=s.ex[e.name]??=Array.from({length:setsFor(s,e)},()=>({w:null,r:null,rir:null}));
  const prev=lastOf(e.name,s.id),ps=prev?prev.ex[e.name].filter(done):[],sug=suggest(e,ps);
  const badge=sug==='up'?' <span class="badge up">↑ hit the top last time, add weight</span>':sug==='easy'?' <span class="badge up">↑ every set felt easy, add weight</span>':sug==='down'?' <span class="badge down">↓ below range last time</span>':'';
  const wu=e===PROGRAM[s.name][0]?warmup(sets[0]?.w):null;
  return`<div class="card ex" data-ex="${esc(e.name)}">
  <h3><span>${esc(e.name)}${e.ss?` <span class="tag">${e.ss}</span>`:''}</span><span class="rx">${setsFor(s,e)} × ${e.lo}–${e.hi} @ ${e.rir}</span></h3>
  <div class="last" data-hist>${prev?`last ${prev.date}: ${fmt(ps)}`:'no history yet'}${badge}</div><div class="hist" hidden></div>
  ${wu==null?'':`<div class="last wu"${wu?'':' hidden'}>${wu}</div>`}
  ${sets.map((st,i)=>setRow(st,i)).join('')}</div>`;
}
function setRow(st,i){
  return`<div class="set${done(st)?' done':''}" data-i="${i}"><span class="n">${i+1}</span>
  <div class="num w"><button data-step="w:-2.5">−</button><input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${st.w??''}" data-k="w"><button data-step="w:2.5">+</button></div>
  <div class="num r"><button data-step="r:-1">−</button><input type="number" inputmode="numeric" placeholder="reps" value="${st.r??''}" data-k="r"><button data-step="r:1">+</button></div>
  <span class="lbl">RIR</span><div class="rir">${[0,1,2,3,4].map(v=>`<button data-rir="${v}" class="${st.rir===v?'on':''}">${v===4?'4+':v}</button>`).join('')}</div></div>`;
}
// Rest timer: counts from a fixed end time, so it stays right after the phone locks and wakes.
let restEnd=0,restLen=0,tick=null;
function startRest(s,name){
  const{rest:sec,next}=afterSet(s,name);
  if(!next)return stopRest();
  restNx.innerHTML=`Next: ${esc(next.name)} <small>set ${next.i+1} of ${s.ex[next.name].length}</small>`;
  restTips.innerHTML=(TIPS[next.name]||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  restLen=sec*1000;restEnd=Date.now()+restLen;
  rest.hidden=false;document.body.classList.add('resting');
  clearInterval(tick);tick=setInterval(drawRest,250);drawRest();
}
function drawRest(){
  const left=Math.max(0,restEnd-Date.now()),sec=Math.ceil(left/1000);
  restClock.textContent=left?`${sec/60|0}:${String(sec%60).padStart(2,'0')}`:'Go';
  restBar.style.width=(restLen?left/restLen*100:0)+'%';
  rest.classList.toggle('go',!left);
  if(!left)clearInterval(tick);
}
function stopRest(){clearInterval(tick);rest.hidden=true;document.body.classList.remove('resting')}
function toggleHist(h){
  const card=h.closest('.ex'),box=card.querySelector('.hist'),name=card.dataset.ex;
  if(!box.hidden){box.hidden=true;return}
  const rows=db.sessions.filter(s=>s!==cur&&s.ex[name]?.some(done)).sort(byDate).slice(0,8).map(s=>`${s.date}  ${fmt(s.ex[name].filter(done))}`);
  box.textContent=rows.join('\n')||'No earlier sessions.';box.hidden=false;
}

app.addEventListener('click',ev=>{
  const h=ev.target.closest('[data-hist]');if(h)return toggleHist(h);
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.start)return session(newSession(b.dataset.start));
  if(b.dataset.open)return session(db.sessions.find(s=>s.id===b.dataset.open));
  if(b.id==='imp')return importFile.click();
  if(b.dataset.cal){const d=new Date(calY,calM+ +b.dataset.cal,1);calY=d.getFullYear();calM=d.getMonth();app.querySelector('.cal').outerHTML=calHTML(calY,calM);return}
  if(b.dataset.rm){const y=scrollY;drop(b.dataset.rm);home();return scrollTo(0,y)}
  if('deload'in b.dataset){
    if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to start the deload week';return}
    db.deload=today();save();return home();
  }
  if(!cur)return;
  if('finish'in b.dataset)return home();
  if('del'in b.dataset){
    if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again to delete';return}
    drop(cur.id);return home();
  }
  const row=b.closest('.set');if(!row)return;
  const st=cur.ex[row.closest('.ex').dataset.ex][+row.dataset.i];
  if(b.dataset.step){
    const[k,d]=b.dataset.step.split(':'),v=Math.max(0,Math.round(((st[k]??0)+ +d)*100)/100);
    st[k]=v;row.querySelector(`input[data-k=${k}]`).value=v;save();return updWarmup(row,st);
  }
  if(b.dataset.rir!==undefined){
    const v=+b.dataset.rir,was=st.rir;st.rir=st.rir===v?null:v;
    row.querySelectorAll('[data-rir]').forEach(x=>x.classList.toggle('on',+x.dataset.rir===st.rir));
    row.classList.toggle('done',st.rir!=null);
    if(st.rir!=null){cur.start??=Date.now();cur.last=Date.now();head()}
    save();
    if(was==null&&st.rir!=null)startRest(cur,row.closest('.ex').dataset.ex);
  }
});
app.addEventListener('input',ev=>{
  const el=ev.target;if(!cur)return;
  const num=v=>v===''?null:+v;
  if(el.dataset.f){cur[el.dataset.f]=el.type==='number'?num(el.value):el.value;save();return}
  if(el.dataset.k){const row=el.closest('.set'),st=cur.ex[row.closest('.ex').dataset.ex][+row.dataset.i];st[el.dataset.k]=num(el.value);save();updWarmup(row,st)}
});
// The warm-up line follows set 1's weight.
function updWarmup(row,st){
  const box=row.closest('.ex').querySelector('.wu');
  if(!box||row.dataset.i!=='0')return;
  box.textContent=warmup(st.w);box.hidden=!box.textContent;
}
back.onclick=home;
document.getElementById('skip').onclick=stopRest;
exp.onclick=async()=>{
  const name=`liftlog-${today()}.json`,file=new File([JSON.stringify(db,null,1)],name,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name})}catch{}return}
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(file),download:name});a.click();
};
importFile.onchange=async()=>{
  const f=importFile.files[0];importFile.value='';if(!f)return;
  try{const d=JSON.parse(await f.text()),have=new Set(db.sessions.map(s=>s.id));
    for(const s of d.sessions||[])if(!have.has(s.id))db.sessions.push(s);
    if(d.deload&&!(db.deload>=d.deload))db.deload=d.deload;
    save();home();hdr.textContent='Imported';}catch{hdr.textContent='Import failed'}
};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// Self-check: open index.html#test. Renders PASS/FAIL lines plus a sample session, touches no saved data.
function runTests(){
  const out=[],t=(n,c)=>out.push((c?'PASS ':'FAIL ')+n),S=(r,rir=1,w=60)=>({w,r,rir});
  const e={name:'x',sets:3,lo:5,hi:8,rir:'1-2'};
  t('up when all sets hit the top',suggest(e,[S(8),S(8),S(8)])==='up');
  t('no up when one set is short',suggest(e,[S(8),S(8),S(7)])===null);
  t('no up with fewer sets than prescribed',suggest(e,[S(8),S(8)])===null);
  t('down when a set is under the range',suggest(e,[S(8),S(6),S(4)])==='down');
  t('null when nothing was rated',suggest(e,[{w:60,r:8,rir:null}])===null);
  t('easy when every set was RIR 3 or more',suggest(e,[S(6,3),S(6,3),S(7,4)])==='easy');
  t('not easy when one set was RIR 2',suggest(e,[S(6,3),S(6,2),S(7,4)])===null);
  t('below range wins over easy',suggest(e,[S(6,3),S(4,4),S(6,3)])==='down');
  t('warm-up from 60 kg',warmup(60)==='Warm-up: bar ×10 · 30 ×5 · 42.5 ×3 · 50 ×1');
  t('warm-up skips steps at bar weight',warmup(30)==='Warm-up: bar ×10 · 25 ×1');
  t('no warm-up without a weight',warmup(null)===''&&warmup(20)==='');
  const T=Date.now();
  t('clock counts from the first set',mins({date:today(),start:T-23*6e4,last:T-6e4},T)===23);
  t('clock stops 30 min after the last set',mins({date:today(),start:T-3*36e5,last:T-2*36e5},T)===60);
  t('no clock on an earlier day',mins({date:'2026-01-01',start:T,last:T},T)===null);
  noSave=true;const real=db;
  const D=n=>addDays(today(),-n);
  db={sessions:[{date:D(0),bw:80},{date:D(2),bw:81},{date:D(8),bw:80.2}]};
  t('bodyweight: 7-day average against the week before',bwLine()==='Bodyweight 80.5 kg, +0.3 on the week before');
  db={sessions:[{date:D(8),bw:80.2}]};
  t('bodyweight: nothing without a weigh-in this week',bwLine()==='');
  db={sessions:[{date:D(34)}]};
  t('deload: week 5 is not due',deloadInfo().week===5&&!deloadInfo().due);
  db={sessions:[{date:D(35)}]};
  t('deload: due in week 6',deloadInfo().due);
  db={sessions:[{date:D(60)}],deload:D(10)};
  t('deload: weeks count from the end of the last one',deloadInfo().week===1&&deloadInfo().after&&!deloadInfo().on);
  db={sessions:[{id:'a',date:D(3),name:'Upper A',ex:{'Barbell Bench Press':[S(8),S(8),S(8)]}}],deload:D(2)};
  t('deload: on for 7 days',deloadInfo().on&&deloadInfo().until===addDays(D(2),6));
  const dA=newSession('Upper A'),dL=newSession('Lower A');
  t('deload: 3 sets become 2, 4 become 2, 2 become 1',dA.deload&&dA.ex['Barbell Bench Press'].length===2&&dA.ex['Incline DB Press'].length===2&&dL.ex['Lateral Neck Flexion (per side)'].length===1);
  dA.ex['Barbell Bench Press'].forEach(x=>{x.rir=1;x.r=5});
  t('deload sessions do not feed badges or prefill',lastOf('Barbell Bench Press').id==='a');
  db={sessions:[{id:'a',date:'2026-01-01',name:'Upper A',bw:80,note:'',ex:{'Barbell Bench Press':[S(8),S(8),S(8)],'Incline DB Press':[S(10,2,24),S(9,1,24),S(8,0,24)],'Overhead Press':[S(7,3,40),S(7,3,40),S(8,4,40)]}}]};
  const s=newSession(nextName());
  t('next session after Upper A is Lower A',s.name==='Lower A');
  const u=newSession('Upper A');
  t('prefill weight from last time',u.ex['Barbell Bench Press'].every(x=>x.w===60));
  t('prefill reps at the bottom after an up',u.ex['Barbell Bench Press'].every(x=>x.r===5));
  t('prefill reps as last time otherwise',u.ex['Incline DB Press'].slice(0,3).map(x=>x.r).join()==='10,9,8');
  t('extra set copies the last logged set',u.ex['Incline DB Press'][3].r===8);
  t('rir blank on prefill',u.ex['Barbell Bench Press'].every(x=>x.rir===null));
  t('prefill reps at the bottom after easy',newSession('Upper B').ex['Overhead Press'].every(x=>x.w===40&&x.r===6));
  session(u);
  db={sessions:[{id:'a'},{id:'b'},{id:'c'}]};drop('b');
  t('delete removes only that session',db.sessions.map(s=>s.id).join()==='a,c');
  db={sessions:[{id:'x',date:'2026-10-05',name:'Upper B'}]};
  const cal=document.createElement('div');cal.innerHTML=calHTML(2026,9);
  t('calendar: October 2026 starts on a Thursday',cal.querySelectorAll('.days>span:not(.day)').length===3);
  t('calendar: 31 days in October',cal.querySelectorAll('.day').length===31);
  t('calendar: trained day opens its session',cal.querySelector('[data-open="x"]')?.textContent==='5UB');
  const all=Object.values(PROGRAM).flat();
  t('every exercise has a rest time and tips',all.every(e=>e.rest>0&&TIPS[e.name]?.length));
  const blank=name=>({name,ex:Object.fromEntries(PROGRAM[name].map(e=>[e.name,Array.from({length:e.sets},()=>({w:null,r:null,rir:null}))]))});
  const ua=blank('Upper A'),N=a=>a.next&&a.next.name+' '+a.next.i+' '+a.rest;
  ua.ex['Barbell Bench Press'][0].rir=1;
  t('rest after a set, same exercise next',N(afterSet(ua,'Barbell Bench Press'))==='Barbell Bench Press 1 180');
  ua.ex['Barbell Bench Press'].forEach(x=>x.rir=1);
  t('last set moves to the next exercise',N(afterSet(ua,'Barbell Bench Press'))==='Incline DB Press 0 180');
  ua.ex['Incline DB Press'][0].rir=1;
  t('A1 goes straight into A2',N(afterSet(ua,'Incline DB Press'))==='Weighted Pull-up / Lat Pulldown 0 0');
  ua.ex['Weighted Pull-up / Lat Pulldown'][0].rir=1;
  t('A2 rests, then back to A1',N(afterSet(ua,'Weighted Pull-up / Lat Pulldown'))==='Incline DB Press 1 120');
  Object.values(ua.ex).flat().forEach(x=>x.rir=1);
  t('nothing next when all sets are done',afterSet(ua,'Face Pull').next===null);
  startRest(u,'Barbell Bench Press');
  out.push('viewport '+innerWidth+'px');
  const pre=document.createElement('pre');pre.id='t';pre.style.whiteSpace='pre-wrap';pre.textContent=out.join('\n');app.prepend(pre);
  db=real;
}
location.hash==='#test'?runTests():home();
</script>
